name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q waraqa-iliktroniya-black-android-project.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: extracted/waraqa-apk-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Waraqa-Electronique-APK
          path: extracted/waraqa-apk-project/app/build/outputs/apk/debug/app-debug.apk
